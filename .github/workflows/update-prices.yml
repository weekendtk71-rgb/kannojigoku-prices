name: 料金の更新
on:
  schedule:
    - cron: "0 17 * * *"   # 毎日 日本時間 午前2時
  workflow_dispatch:        # 手動でも実行できる
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python fetch_prices.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.json
          git diff --cached --quiet || git commit -m "料金更新 $(TZ=Asia/Tokyo date +%F)"
          git push
